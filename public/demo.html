<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.json"><title>Demo de inscrição</title>
<style>
body{font:16px system-ui,sans-serif;max-width:440px;margin:10vh auto;padding:0 20px;text-align:center;color:#222}
h1{margin-bottom:8px}
p.sub{color:#666;font-size:14px;line-height:1.5;margin-bottom:20px}
.box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:20px;text-align:left;font-size:14px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:600;font-size:12px}
.granted{background:#dcfce7;color:#166534}
.denied{background:#fee2e2;color:#991b1b}
.default{background:#fef3c7;color:#854d0e}
button{display:block;width:100%;padding:14px 20px;font:inherit;font-weight:600;border:0;border-radius:12px;background:#0b7a75;color:#fff;cursor:pointer;margin-bottom:10px}
button.sec{background:#e2e8f0;color:#1e293b}
#st{margin-top:14px;font-size:14px;line-height:1.5}
.help{background:#fff3cd;color:#856404;border:1px solid #ffeeba;padding:12px;border-radius:8px;margin-top:14px;text-align:left;font-size:13px;display:none}
</style></head>
<body>
<h1>Receber notificações</h1>
<p class="sub">Página de teste para se inscrever e validar notificações no seu navegador.</p>

<div class="box">
  <div>Permissão no navegador: <span id="perm-badge" class="badge">verificando...</span></div>
  <div id="perm-help" class="help"></div>
</div>

<button id="b">Ativar notificações</button>
<button id="b-local" class="sec" type="button">Testar notificação local (sistema)</button>
<p id="st"></p>

<script src="./push-client.js"></script>
<script src="./demo.js"></script>
</body></html>
